[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pokecrack-worker"
version = "0.1.0"
description = "Policy-gated collection and background worker for Pokecrack"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "PyYAML>=6.0,<7",
  "structlog>=24.2,<26",
  "tenacity>=8.5,<10",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
scrapling = ["scrapling[fetchers]>=0.2"]
images = ["ImageHash>=4.3,<5", "Pillow>=10,<13"]
dev = [
  "mypy>=1.11,<2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
pokecrack-worker = "pokecrack_worker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pokecrack_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["pokecrack_worker"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.mypy]
cache_dir = "/tmp/pokecrack-worker-mypy"
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
