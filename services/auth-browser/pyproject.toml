[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pokecrack-auth-browser"
version = "0.1.0"
description = "Persistent headed Chromium and bounded OpenCLI adapter service"
requires-python = ">=3.12"
dependencies = ["playwright==1.55.0"]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
pokecrack-browser = "pokecrack_browser.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pokecrack_browser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
cache_dir = "/tmp/pokecrack-browser-mypy"
python_version = "3.12"
strict = true
files = ["src/pokecrack_browser"]
