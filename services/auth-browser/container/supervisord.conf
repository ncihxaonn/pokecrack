[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/pokecrack-browser/supervisord.pid
user=pokecrack

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1440x900x24 -nolisten tcp -ac
autostart=true
autorestart=unexpected
startretries=3
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:fluxbox]
command=/usr/bin/fluxbox -display :99
autostart=true
autorestart=unexpected
startretries=3
priority=20
environment=DISPLAY=":99"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -listen 127.0.0.1 -rfbport 5900 -rfbauth %(ENV_VNC_PASSWORD_FILE)s -noxdamage
autostart=true
autorestart=unexpected
startretries=3
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 127.0.0.1:6080 127.0.0.1:5900
autostart=true
autorestart=unexpected
startretries=3
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:browser-bridge-daemon]
command=/usr/bin/python3 /opt/pokecrack/auth-browser/container/run_bridge_daemon.py
autostart=true
autorestart=unexpected
startretries=3
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
