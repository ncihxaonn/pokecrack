name: pokecrack-web

services:
  web:
    image: "${POKECRACK_WEB_IMAGE:-pokecrack-web}:${DEPLOY_SHA:?DEPLOY_SHA must be an exact 40-character Git commit}"
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        NODE_IMAGE: "${NODE_IMAGE:-node:22.13.0-bookworm-slim}"
        DEPLOY_SHA: "${DEPLOY_SHA:?DEPLOY_SHA must be an exact 40-character Git commit}"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    env_file:
      - "${POKECRACK_WEB_ENV_FILE:-/home/codex/.config/pokecrack/web.env}"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${WEB_HOST_BIND:-0.0.0.0}:${WEB_HOST_PORT:-3000}:3000"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/status').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    cpus: "${WEB_CPUS:-0.50}"
    mem_limit: "${WEB_MEMORY:-512m}"
    pids_limit: 256
