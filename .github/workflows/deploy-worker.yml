name: Deploy VPS workers

on:
  workflow_dispatch:
    inputs:
      confirm_sha:
        description: Exact GITHUB_SHA to deploy
        required: true
        type: string
      service_set:
        description: Exact worker service set to deploy
        required: true
        default: tcgdex
        type: choice
        options:
          - tcgdex
          - tcgdex-nostr
          - tcgdex-bluesky
      retire_nostr:
        description: Explicitly retire the managed Nostr container (tcgdex only)
        required: true
        default: false
        type: boolean
      retire_bluesky:
        description: Explicitly retire the managed Bluesky container (tcgdex only)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pokecrack-vps-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: worker-production
    env:
      REQUESTED_SHA: ${{ inputs.confirm_sha }}
      REQUESTED_SERVICE_SET: ${{ inputs.service_set }}
      REQUESTED_RETIRE_NOSTR: ${{ inputs.retire_nostr }}
      REQUESTED_RETIRE_BLUESKY: ${{ inputs.retire_bluesky }}
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
      VPS_DEPLOY_STATE_DIR: ${{ vars.VPS_DEPLOY_STATE_DIR || '/var/lib/pokecrack/deploy' }}
      VPS_ENV_FILE: ${{ vars.VPS_ENV_FILE || '/etc/pokecrack/production.env' }}
      VPS_NOSTR_ENV_FILE: ${{ vars.VPS_NOSTR_ENV_FILE || '/etc/pokecrack/nostr.env' }}
      VPS_BLUESKY_ENV_FILE: ${{ vars.VPS_BLUESKY_ENV_FILE || '/etc/pokecrack/bluesky.env' }}
      SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - name: Verify exact requested SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$REQUESTED_SHA" == "$GITHUB_SHA" ]] || {
              printf 'confirm_sha must equal GITHUB_SHA (%s)\n' "$GITHUB_SHA" >&2
              exit 1
            }
            case "$REQUESTED_SERVICE_SET" in
              tcgdex|tcgdex-nostr|tcgdex-bluesky) ;;
              *) printf 'unsupported service_set\n' >&2; exit 1 ;;
            esac
            [[ "$REQUESTED_RETIRE_NOSTR" == true || "$REQUESTED_RETIRE_NOSTR" == false ]]
            [[ "$REQUESTED_RETIRE_BLUESKY" == true || "$REQUESTED_RETIRE_BLUESKY" == false ]]
            if [[ "$REQUESTED_RETIRE_NOSTR" == true ]]; then
              [[ "$REQUESTED_SERVICE_SET" == tcgdex ]]
            fi
            if [[ "$REQUESTED_RETIRE_BLUESKY" == true ]]; then
              [[ "$REQUESTED_SERVICE_SET" == tcgdex ]]
            fi
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure pinned SSH host identity
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          [[ "$VPS_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$VPS_DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ && "$VPS_DEPLOY_PATH" != *'..'* ]]
          [[ "$VPS_DEPLOY_STATE_DIR" =~ ^/[A-Za-z0-9._/-]+$ && "$VPS_DEPLOY_STATE_DIR" != *'..'* ]]
          [[ "$VPS_ENV_FILE" =~ ^/[A-Za-z0-9._/-]+$ && "$VPS_ENV_FILE" != *'..'* ]]
          [[ "$VPS_NOSTR_ENV_FILE" =~ ^/[A-Za-z0-9._/-]+$ && "$VPS_NOSTR_ENV_FILE" != *'..'* ]]
          [[ "$VPS_BLUESKY_ENV_FILE" =~ ^/[A-Za-z0-9._/-]+$ && "$VPS_BLUESKY_ENV_FILE" != *'..'* ]]
          [[ -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]]
          install -d -m 0700 "$HOME/.ssh"
          install -m 0600 /dev/null "$HOME/.ssh/id_ed25519"
          install -m 0600 /dev/null "$HOME/.ssh/known_hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
      - name: Deploy and verify the exact GITHUB_SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          [[ "$(git rev-parse --verify HEAD)" == "$GITHUB_SHA" ]]
          bundle_file="$RUNNER_TEMP/pokecrack-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.bundle"
          remote_bundle=''
          # deploy.sh can spend several minutes in a silent, bounded health loop.
          # Protocol keepalives prevent an idle network path from dropping that SSH session.
          ssh_options=(
            -i "$HOME/.ssh/id_ed25519"
            -p "$VPS_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=3
          )

          cleanup_bundle() {
            rm -f -- "$bundle_file"
            if [[ -n "$remote_bundle" ]]; then
              printf -v cleanup_command 'rm -f -- %q' "$remote_bundle"
              ssh "${ssh_options[@]}" \
                "$VPS_USER@$VPS_HOST" "$cleanup_command" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_bundle EXIT

          git bundle create "$bundle_file" HEAD
          git bundle verify "$bundle_file" >/dev/null
          chmod 0600 "$bundle_file"
          remote_bundle_candidate="$(ssh "${ssh_options[@]}" \
            "$VPS_USER@$VPS_HOST" \
            'umask 077; mktemp /tmp/pokecrack-deploy-bundle.XXXXXXXX')"
          [[ "$remote_bundle_candidate" =~ ^/tmp/pokecrack-deploy-bundle\.[A-Za-z0-9]{8}$ ]]
          remote_bundle=$remote_bundle_candidate
          unset remote_bundle_candidate
          printf -v upload_command 'cat > %q' "$remote_bundle"
          ssh "${ssh_options[@]}" \
            "$VPS_USER@$VPS_HOST" "$upload_command" < "$bundle_file"

          printf -v remote_command 'bash -s -- %q %q %q %q %q %q %q %q %q %q' \
            "$GITHUB_SHA" "$VPS_DEPLOY_PATH" "$VPS_ENV_FILE" \
            "$VPS_NOSTR_ENV_FILE" "$VPS_BLUESKY_ENV_FILE" \
            "$REQUESTED_SERVICE_SET" "$REQUESTED_RETIRE_NOSTR" \
            "$REQUESTED_RETIRE_BLUESKY" "$remote_bundle" "$VPS_DEPLOY_STATE_DIR"
          ssh "${ssh_options[@]}" \
            "$VPS_USER@$VPS_HOST" "$remote_command" <<'REMOTE'
          set -Eeuo pipefail
          sha=$1
          repository=$2
          env_file=$3
          nostr_env_file=$4
          bluesky_env_file=$5
          service_set=$6
          retire_nostr=$7
          retire_bluesky=$8
          bundle=$9
          state_dir=${10}
          cleanup_bundle() {
            rm -f -- "$bundle"
          }
          trap cleanup_bundle EXIT
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$bundle" =~ ^/tmp/pokecrack-deploy-bundle\.[A-Za-z0-9]{8}$ ]]
          [[ -f "$bundle" && ! -L "$bundle" ]]
          [[ "$(stat -c '%a' "$bundle")" == 600 ]]
          [[ "$state_dir" =~ ^/[A-Za-z0-9._/-]+$ && "$state_dir" != *'..'* ]]
          case "$service_set" in
            tcgdex|tcgdex-nostr|tcgdex-bluesky) ;;
            *) exit 2 ;;
          esac
          [[ "$retire_nostr" == true || "$retire_nostr" == false ]]
          [[ "$retire_bluesky" == true || "$retire_bluesky" == false ]]
          if [[ "$retire_nostr" == true ]]; then
            [[ "$service_set" == tcgdex ]]
          fi
          if [[ "$retire_bluesky" == true ]]; then
            [[ "$service_set" == tcgdex ]]
          fi
          [[ -d "$repository/.git" ]]
          git -C "$repository" diff --quiet --ignore-submodules --
          git -C "$repository" diff --cached --quiet --ignore-submodules --
          [[ -z $(git -C "$repository" status --porcelain --untracked-files=all) ]]
          [[ "$(git -C "$repository" remote get-url origin)" == "https://github.com/ncihxaonn/pokecrack.git" ]]
          [[ "$(git -C "$repository" bundle list-heads "$bundle" | awk '$2 == "HEAD" { print $1 }')" == "$sha" ]]
          git -C "$repository" bundle verify "$bundle" >/dev/null
          if ! git -C "$repository" cat-file -e "${sha}^{commit}" 2>/dev/null; then
            git -C "$repository" fetch --no-tags --no-write-fetch-head "$bundle" HEAD
          fi
          resolved=$(git -C "$repository" rev-parse --verify "${sha}^{commit}")
          [[ "$resolved" == "$sha" ]]
          git -C "$repository" checkout --detach "$sha"
          deploy_args=(
            --env-file "$env_file"
            --state-dir "$state_dir"
            --service-set "$service_set"
          )
          if [[ "$service_set" == tcgdex-nostr ]]; then
            deploy_args+=(--nostr-env-file "$nostr_env_file")
          elif [[ "$service_set" == tcgdex-bluesky ]]; then
            deploy_args+=(--bluesky-env-file "$bluesky_env_file")
          fi
          if [[ "$retire_nostr" == true ]]; then
            deploy_args+=(--retire-nostr)
          fi
          if [[ "$retire_bluesky" == true ]]; then
            deploy_args+=(--retire-bluesky)
          fi
          "$repository/deploy/scripts/deploy.sh" "$sha" "${deploy_args[@]}"
          actual=$(git -C "$repository" rev-parse --verify HEAD)
          [[ "$actual" == "$sha" ]]
          REMOTE
      - name: Remove transient SSH key
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519"
