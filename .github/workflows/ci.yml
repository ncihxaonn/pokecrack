name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.13.0"
          cache: pnpm
      - name: Run canonical Web checks
        run: scripts/run_ci_checks.sh web --expected-sha "$GITHUB_SHA" --evidence-dir "/tmp/pokecrack-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-web"

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.6"
          enable-cache: true
      - name: Run canonical Worker checks
        run: scripts/run_ci_checks.sh worker --expected-sha "$GITHUB_SHA" --evidence-dir "/tmp/pokecrack-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-worker"

  auth-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.6"
          enable-cache: true
      - name: Run canonical auth-browser checks
        run: scripts/run_ci_checks.sh auth-browser --expected-sha "$GITHUB_SHA" --evidence-dir "/tmp/pokecrack-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-auth-browser"

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.13.0"
      - name: Run canonical database checks
        run: scripts/run_ci_checks.sh database --expected-sha "$GITHUB_SHA" --evidence-dir "/tmp/pokecrack-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-database"

  container-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run canonical worker image build
        run: scripts/run_ci_checks.sh container-worker --expected-sha "$GITHUB_SHA" --evidence-dir "/tmp/pokecrack-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-container-worker"

  repository-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Run canonical repository policy checks
        run: scripts/run_ci_checks.sh repository-policy --expected-sha "$GITHUB_SHA" --evidence-dir "/tmp/pokecrack-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-repository-policy"

  deployment-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run canonical deployment contract checks
        run: scripts/run_ci_checks.sh deployment-contracts --expected-sha "$GITHUB_SHA" --evidence-dir "/tmp/pokecrack-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-deployment-contracts"
