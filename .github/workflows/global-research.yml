name: Global multi-source research

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Search focus; all countries remain eligible
        type: choice
        default: auto
        options: [auto, global, asia, europe, north-america, latin-america, africa, oceania]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pokecrack-research-ledger
  cancel-in-progress: false

jobs:
  research:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: worker-production
    env:
      REQUESTED_SCOPE: ${{ inputs.scope || 'auto' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resume saved research checkpoint without executing branch code
        run: python3 scripts/research_checkpoint.py
      - name: Choose global search focus
        run: |
          set -Eeuo pipefail
          scope=$(python3 scripts/global_research.py --scope "$REQUESTED_SCOPE" --select-only)
          echo "SCOPE=$scope" >> "$GITHUB_ENV"
      - name: Research on MAM with existing Codex login
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          umask 077
          [[ "$VPS_HOST" == 72.62.101.225 && "$VPS_USER" == codex ]]
          [[ "$VPS_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$SCOPE" =~ ^(global|asia|europe|north-america|latin-america|africa|oceania)$ ]]
          [[ -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]]
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/global-ssh.XXXXXX")
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset SSH_PRIVATE_KEY SSH_KNOWN_HOSTS
          opts=(-i "$ssh_dir/key" -o "UserKnownHostsFile=$ssh_dir/known_hosts"
                -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
                -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=3)
          remote_dir=''
          cleanup() {
            if [[ "$remote_dir" =~ ^/tmp/pokecrack-global-job\.[A-Za-z0-9]{8}$ ]]; then
              ssh "${opts[@]}" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
                "rm -f -- '$remote_dir/global_research.py' '$remote_dir/global_studies.py' '$remote_dir/asia_research.py' '$remote_dir/research_ledger.py'; rmdir -- '$remote_dir'" || true
            fi
            rm -f -- "$ssh_dir/key" "$ssh_dir/known_hosts"
            rmdir -- "$ssh_dir"
          }
          trap cleanup EXIT
          remote_dir=$(ssh "${opts[@]}" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            'umask 077; mktemp -d /tmp/pokecrack-global-job.XXXXXXXX')
          [[ "$remote_dir" =~ ^/tmp/pokecrack-global-job\.[A-Za-z0-9]{8}$ ]]
          scp "${opts[@]}" -P "$VPS_PORT" scripts/global_research.py scripts/global_studies.py scripts/asia_research.py \
            scripts/research_ledger.py \
            "$VPS_USER@$VPS_HOST:$remote_dir/"
          ssh "${opts[@]}" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "PYTHONDONTWRITEBYTECODE=1 python3 '$remote_dir/global_research.py' --scope '$SCOPE'" > "$RUNNER_TEMP/global-report.json"
      - name: Accumulate research history and deduplicate ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 scripts/global_research.py --publish "$RUNNER_TEMP/global-report.json" > "$RUNNER_TEMP/global-ledger.json"
          echo 'Global research references accumulated and deduplicated. Not admitted production samples.' >> "$GITHUB_STEP_SUMMARY"
      - name: Queue unified research ledger update
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/queue_research_ledger.py
      - name: Save deduplicated research snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: global-research-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/global-ledger.json
          retention-days: 90
          if-no-files-found: error
