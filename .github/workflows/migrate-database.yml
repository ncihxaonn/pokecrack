name: Migrate production database

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub environment holding the owner-scoped Personal Supabase token
        required: true
        type: environment
      confirm_sha:
        description: Exact GITHUB_SHA containing the forward migrations
        required: true
        type: string
      backup_reference:
        description: Operator-confirmed fresh backup filename or provider snapshot ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pokecrack-database-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: ${{ inputs.environment }}
    env:
      CONFIRM_SHA: ${{ inputs.confirm_sha }}
      BACKUP_REFERENCE: ${{ inputs.backup_reference }}
      SUPABASE_PROJECT_REF: wohnphsxlquhhknuthrj
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Verify operator confirmation and exact checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CONFIRM_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CONFIRM_SHA" == "$GITHUB_SHA" ]]
          [[ "$BACKUP_REFERENCE" =~ ^[A-Za-z0-9][A-Za-z0-9._:/@+-]{0,255}$ ]]
          [[ "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]
          [[ "$(git rev-parse --verify HEAD)" == "$GITHUB_SHA" ]]
      - name: Verify hosted PostgreSQL 17 and read the migration ledger
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -Eeuo pipefail
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]]
          # Runner contract: server_version_num >= 170000.
          python3 scripts/run_supabase_migrations.py list \
            --project-ref "$SUPABASE_PROJECT_REF" \
            > /tmp/pokecrack-applied-migrations.txt
      - name: Audit only pending migrations against the reviewed DELETE allowlist
        run: |
          python3 scripts/check_migration_safety.py \
            --applied-versions-file /tmp/pokecrack-applied-migrations.txt \
            --allowlist config/migration-safety-allowlist.json
      - name: Build the target schema locally before touching production
        shell: bash
        run: |
          set -Eeuo pipefail
          npx --yes supabase@2.115.0 start
          npx --yes supabase@2.115.0 db reset
          install -d -m 0700 generated-types
          npx --yes supabase@2.115.0 gen types typescript --local \
            --schema public,catalog,ingest,analytics \
            > generated-types/database.generated.ts
          test -s generated-types/database.generated.ts
      - name: Reject generated TypeScript type drift before migration
        run: diff --unified supabase/types/database.ts generated-types/database.generated.ts
      - name: Upload generated database types for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: database-types-${{ github.sha }}
          path: generated-types/database.generated.ts
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop local Supabase validation stack
        if: always()
        run: npx --yes supabase@2.115.0 stop --no-backup
      - name: Preview forward-only migrations through the Management API
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -Eeuo pipefail
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]]
          python3 scripts/run_supabase_migrations.py preview \
            --project-ref "$SUPABASE_PROJECT_REF"
      - name: Apply forward migrations through the Management API
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -Eeuo pipefail
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]]
          python3 scripts/run_supabase_migrations.py apply \
            --project-ref "$SUPABASE_PROJECT_REF"
      - name: Verify no migrations remain pending
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -Eeuo pipefail
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]]
          python3 scripts/run_supabase_migrations.py verify \
            --project-ref "$SUPABASE_PROJECT_REF"
