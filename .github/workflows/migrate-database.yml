name: Migrate production database

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub environment holding SUPABASE_DB_URL
        required: true
        type: environment
      confirm_sha:
        description: Exact GITHUB_SHA containing the forward migrations
        required: true
        type: string
      backup_reference:
        description: Operator-confirmed fresh backup filename or provider snapshot ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pokecrack-database-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: ${{ inputs.environment }}
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CONFIRM_SHA: ${{ inputs.confirm_sha }}
      BACKUP_REFERENCE: ${{ inputs.backup_reference }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Verify operator confirmation and exact checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CONFIRM_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CONFIRM_SHA" == "$GITHUB_SHA" ]]
          [[ "$BACKUP_REFERENCE" =~ ^[A-Za-z0-9][A-Za-z0-9._:/@+-]{0,255}$ ]]
          [[ -n "$SUPABASE_DB_URL" ]]
          [[ "$(git rev-parse --verify HEAD)" == "$GITHUB_SHA" ]]
      - name: Verify PostgreSQL 17 and read applied migrations without exposing the URL
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v psql >/dev/null
          run_database_command() {
            printf '%s' "$SUPABASE_DB_URL" \
              | python3 deploy/lib/run_with_database_url.py -- "$@"
          }
          server_version_num=$(run_database_command \
            psql --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align \
              --command "select current_setting('server_version_num')")
          [[ "$server_version_num" =~ ^[0-9]+$ ]]
          (( server_version_num >= 170000 ))
          run_database_command \
            psql --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align \
              --command 'select version from supabase_migrations.schema_migrations order by version' \
            > /tmp/pokecrack-applied-migrations.txt
      - name: Audit only pending migrations against the reviewed DELETE allowlist
        run: |
          python3 scripts/check_migration_safety.py \
            --applied-versions-file /tmp/pokecrack-applied-migrations.txt \
            --allowlist config/migration-safety-allowlist.json
      - name: Build the target schema locally before touching production
        shell: bash
        run: |
          set -Eeuo pipefail
          npx --yes supabase@2.115.0 start
          npx --yes supabase@2.115.0 db reset
          install -d -m 0700 generated-types
          npx --yes supabase@2.115.0 gen types typescript --local \
            --schema public,catalog,ingest,analytics \
            > generated-types/database.generated.ts
          test -s generated-types/database.generated.ts
      - name: Reject generated TypeScript type drift before migration
        run: diff --unified supabase/types/database.ts generated-types/database.generated.ts
      - name: Upload generated database types for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: database-types-${{ github.sha }}
          path: generated-types/database.generated.ts
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop local Supabase validation stack
        if: always()
        run: npx --yes supabase@2.115.0 stop --no-backup
      - name: Preview forward-only migration
        shell: bash
        run: |
          set -Eeuo pipefail
          npx --yes supabase@2.115.0 db push --dry-run --db-url "$SUPABASE_DB_URL"
      - name: Apply forward migrations
        shell: bash
        run: |
          set -Eeuo pipefail
          npx --yes supabase@2.115.0 db push --db-url "$SUPABASE_DB_URL"
      - name: Verify no migrations remain pending
        shell: bash
        run: |
          set -Eeuo pipefail
          npx --yes supabase@2.115.0 db push --dry-run --db-url "$SUPABASE_DB_URL"
