name: Country-first multi-source research

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: pokecrack-global-research
  cancel-in-progress: false

jobs:
  research:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: worker-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Resume country priority from verified research history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 scripts/country_research.py --select > "$RUNNER_TEMP/country-selection.json"
      - name: Research selected countries on MAM
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          umask 077
          [[ "$VPS_HOST" == 72.62.101.225 && "$VPS_USER" == codex ]]
          [[ "$VPS_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]]
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/country-ssh.XXXXXX")
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset SSH_PRIVATE_KEY SSH_KNOWN_HOSTS
          opts=(-i "$ssh_dir/key" -o "UserKnownHostsFile=$ssh_dir/known_hosts"
                -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
                -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=3)
          remote_dir=''
          cleanup() {
            if [[ "$remote_dir" =~ ^/tmp/pokecrack-country-job\.[A-Za-z0-9]{8}$ ]]; then
              ssh "${opts[@]}" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
                "rm -f -- '$remote_dir/country_research.py' '$remote_dir/country_targets.py' '$remote_dir/global_research.py' '$remote_dir/global_studies.py' '$remote_dir/asia_research.py' '$remote_dir/country-selection.json'; rmdir -- '$remote_dir'" || true
            fi
            rm -f -- "$ssh_dir/key" "$ssh_dir/known_hosts"
            rmdir -- "$ssh_dir"
          }
          trap cleanup EXIT
          remote_dir=$(ssh "${opts[@]}" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            'umask 077; mktemp -d /tmp/pokecrack-country-job.XXXXXXXX')
          [[ "$remote_dir" =~ ^/tmp/pokecrack-country-job\.[A-Za-z0-9]{8}$ ]]
          scp "${opts[@]}" -P "$VPS_PORT" scripts/country_research.py scripts/country_targets.py \
            scripts/global_research.py scripts/global_studies.py scripts/asia_research.py \
            "$RUNNER_TEMP/country-selection.json" "$VPS_USER@$VPS_HOST:$remote_dir/"
          ssh "${opts[@]}" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "PYTHONDONTWRITEBYTECODE=1 python3 '$remote_dir/country_research.py' --research '$remote_dir/country-selection.json'" \
            > "$RUNNER_TEMP/country-report.json"
      - name: Preserve country checks and deduplicate original cohorts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 scripts/country_research.py --publish "$RUNNER_TEMP/country-report.json" \
            --selection "$RUNNER_TEMP/country-selection.json" > "$RUNNER_TEMP/country-ledger.json"
          echo 'Country research retained. All 249 ISO country/area targets: Asia → Oceania → Europe → Africa → Northern America → Latin America and Caribbean → Antarctica. No production samples automatically admitted by research.' >> "$GITHUB_STEP_SUMMARY"
      - name: Save country progress and deduplicated research snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: country-research-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/country-ledger.json
          retention-days: 90
          if-no-files-found: error
      - name: Queue reviewed-history references on the deployed MAM collector
        if: vars.COUNTRY_RESEARCH_INTAKE_ENABLED == 'true'
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          umask 077
          [[ "$VPS_HOST" == 72.62.101.225 && "$VPS_USER" == codex ]]
          [[ "$VPS_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]]
          # The input is the reconstructed, deduplicated bot-owned history, not
          # the untrusted research process's output. No counts enter this lane.
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          python3 scripts/research_intake.py "$RUNNER_TEMP/country-ledger.json" \
            > "$RUNNER_TEMP/research-intake.json"
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/intake-ssh.XXXXXX")
          cleanup() {
            rm -f -- "$ssh_dir/key" "$ssh_dir/known_hosts" "$RUNNER_TEMP/research-intake.json"
            rmdir -- "$ssh_dir"
          }
          trap cleanup EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset SSH_PRIVATE_KEY SSH_KNOWN_HOSTS
          ssh -i "$ssh_dir/key" -o "UserKnownHostsFile=$ssh_dir/known_hosts" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "bash /home/codex/pokecrack/deploy/scripts/import-research-intake.sh '$GITHUB_SHA'" \
            < "$RUNNER_TEMP/research-intake.json" > "$RUNNER_TEMP/research-intake-result.json"
          echo 'Research references entered the private review queue. Source access and independently verified pack evidence remain separately gated.' >> "$GITHUB_STEP_SUMMARY"
      - name: Save bounded intake outcome
        if: vars.COUNTRY_RESEARCH_INTAKE_ENABLED == 'true' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: country-intake-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/research-intake-result.json
          retention-days: 90
          if-no-files-found: warn
