<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pokémon · 模型比例查看</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1420;color:#eef6ff;font-family:system-ui,sans-serif}header{max-width:1400px;margin:auto;padding:32px 32px 20px}small{color:#90a5ba;letter-spacing:.2em}h1{font-size:clamp(28px,4vw,46px);margin:12px 0 22px;font-weight:600;letter-spacing:-.04em}nav{display:flex;gap:8px;flex-wrap:wrap}button,a{color:inherit;font:inherit}button{padding:10px 18px;background:#172636;border:1px solid #304658;border-radius:99px;cursor:pointer}button[aria-pressed=true]{background:#e4ee88;color:#172012;border-color:#e4ee88}button:focus-visible{outline:3px solid #8bc8ff;outline-offset:3px}main{position:relative;margin:0 24px;max-width:1400px;height:min(62vh,600px);min-height:350px;background:radial-gradient(ellipse at 50% 80%,#1f3a4e,#101d2b 80%);border:1px solid #293d4d;border-radius:24px;overflow:hidden}canvas{width:100%;height:100%;display:block}.labels{position:absolute;inset:20px 0 auto;display:grid;grid-template-columns:repeat(4,1fr);text-align:center;color:#a9bed0;font-size:13px;pointer-events:none}.labels span+span{border-left:1px solid #304657}footer{padding:20px 32px;color:#93aabd;font-size:13px;display:flex;gap:24px;flex-wrap:wrap}#status{margin-left:auto}@media(max-width:700px){main{height:65vh;margin:0 12px}.labels{height:100%;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}header{padding:24px 20px}footer{padding:16px 20px}}
</style></head><body><header><small>POKÉCRACK · MODEL STUDY</small><h1>熟悉的伙伴。每个角度。</h1><nav aria-label="选择宝可梦"><button data-model="pikachu" aria-pressed="true">皮卡丘</button><button data-model="snorlax" aria-pressed="false">卡比兽</button><button data-model="charizard" aria-pressed="false">喷火龙</button><button id="pause" aria-pressed="false">暂停动作</button></nav></header><main><canvas aria-label="宝可梦正面、侧面、背面与四分之三视角的实时三维模型"></canvas><div class="labels"><span>正面</span><span>侧面</span><span>背面</span><span>¾ 视角</span></div></main><footer><a href="/">返回 Hero 预览 ↗</a><a href="https://github.com/06wj/pokemon" target="_blank" rel="noreferrer">模型来源 ↗</a><span id="status" role="status">正在加载模型…</span></footer><script src="secret-pathways-assets/three.min.js"></script><script src="pokemon-models/loader.js"></script><script>
/* CHARACTER_FACTORY */
const canvas=document.querySelector('canvas'), renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.outputEncoding=THREE.sRGBEncoding;renderer.physicallyCorrectLights=true;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
const scene=new THREE.Scene();scene.add(new THREE.HemisphereLight(0xcfeaff,0x243342,.7));
for(const [color,intensity,position] of [[0xffedcf,2.4,[-3,5,6]],[0x7acbe8,1.3,[4,3,-4]],[0xe9f4ff,.35,[3,1,5]]]){const light=new THREE.DirectionalLight(color,intensity);light.position.set(...position);scene.add(light);}
const actors=new Map();let active,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,clock=0,prev=0,frame=0;
function draw(now){frame=0;const dt=prev?Math.min(.05,(now-prev)/1000):0;prev=now;if(!paused)clock+=dt;
 const width=canvas.clientWidth,height=canvas.clientHeight;if(canvas.width!==Math.round(width*renderer.getPixelRatio())||canvas.height!==Math.round(height*renderer.getPixelRatio()))renderer.setSize(width,height,false);
 renderer.setScissorTest(false);renderer.clear();if(active){active.update(clock,paused);const cols=width<680?2:4,rows=4/cols,w=width/cols,h=height/rows;
 for(let i=0;i<4;i++){const left=i%cols*w,bottom=height-(Math.floor(i/cols)+1)*h;if(active.viewAspect!==w/h){active.views=[0,Math.PI/2,Math.PI,.42].map((a,j)=>createPokemonCamera(active,a,j===3?.7:0,w/h));active.viewAspect=w/h;}const camera=active.views[i];renderer.setViewport(left,bottom,w,h);renderer.setScissor(left,bottom,w,h);renderer.setScissorTest(true);renderer.render(scene,camera);}
 }if(!document.hidden)frame=requestAnimationFrame(draw);}
function select(kind){if(active)scene.remove(active.group);active=actors.get(kind);if(active)scene.add(active.group);document.querySelectorAll('[data-model]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.model===kind)));document.documentElement.dataset.model=kind;}
document.querySelectorAll('[data-model]').forEach(b=>b.addEventListener('click',()=>select(b.dataset.model)));
const pause=document.getElementById('pause');function updatePause(){pause.setAttribute('aria-pressed',String(paused));pause.textContent=paused?'播放动作':'暂停动作';}updatePause();pause.addEventListener('click',()=>{paused=!paused;updatePause();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(frame);frame=0;}else if(!frame){prev=0;frame=requestAnimationFrame(draw);}});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
loadPokemonModels().then(()=>{for(const kind of ['pikachu','snorlax','charizard']){const actor=createPokemonCharacter(kind);if(actor)actors.set(kind,actor);}select('pikachu');document.getElementById('status').textContent=actors.size===3?'3D 骨骼动画 · 保留原始比例':'部分模型加载失败';document.documentElement.dataset.characterStatus=actors.size===3?'ready':'partial';frame=requestAnimationFrame(draw);});
</script></body></html>
