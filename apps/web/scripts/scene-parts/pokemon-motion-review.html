<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pokémon · 动作研究</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1420;color:#eef6ff;font:15px system-ui,sans-serif}header,footer{padding:24px 5vw}small{color:#90a5ba;letter-spacing:.18em}h1{font-size:32px;letter-spacing:-.04em;margin:10px 0 20px}nav,.controls{display:flex;gap:8px;flex-wrap:wrap}button,a{color:inherit;font:inherit}button{padding:9px 17px;background:#172636;border:1px solid #304658;border-radius:99px;cursor:pointer}button[aria-pressed=true]{background:#e4ee88;color:#172012}button:focus-visible,input:focus-visible{outline:3px solid #8bc8ff;outline-offset:3px}main{position:relative;height:58vh;min-height:390px;margin:0 4vw;overflow:hidden;border:1px solid #293d4d;border-radius:24px;background:radial-gradient(ellipse at 50% 70%,#234056,#101d2b 80%)}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}footer{display:grid;gap:18px}label{display:flex;gap:16px;align-items:center}input{flex:1;accent-color:#d7ec98;max-width:700px}#status{color:#9bb3c7}a{font-size:13px}#phase{position:absolute;left:22px;top:18px;color:#b8cdde} @media(max-width:650px){h1{font-size:26px}main{height:52vh}}
</style></head><body><header><small>POKÉCRACK · MOTION STUDY</small><h1>每个动作，都有重量。</h1><nav><button data-kind="pikachu" aria-pressed="false">皮卡丘</button><button data-kind="snorlax" aria-pressed="true">卡比兽</button><button data-kind="charizard" aria-pressed="false">喷火龙</button><button id="loop" aria-pressed="false">循环走场</button><button id="slow" aria-pressed="false">慢放 ¼×</button><button id="pause" aria-pressed="false">暂停动作</button></nav></header><main><canvas aria-label="与 Hero 共用骨骼和滚动动作的三维预览"></canvas><span id="phase">加载中</span></main><footer><label>滚动进度 <input aria-label="滚动进度" type="range" min="-0.72" max="0.73" step="0.005" value="0"></label><div><button id="back">← 上一帧</button> <button id="forward">下一帧 →</button></div><div class="controls"><button data-at="-0.38">进场</button><button data-at="0">停留</button><button data-at="0.34">翻身 / 转向</button><button data-at="0.46">滑落 / 起飞</button><button data-at="0.56">下坠 / 飞离</button></div><span id="status" role="status">正在加载模型…</span><details><summary>自然动作参考 ↗</summary><p><a href="https://cfs.mcz.harvard.edu/news-media/jerboa" target="_blank" rel="noopener">皮卡丘 · 哈佛跳鼠高速摄影</a></p><p><a href="https://nationalzoo.si.edu/animals/news/bei-bei-plays-snow" target="_blank" rel="noopener">卡比兽 · Smithsonian 熊猫翻滚</a></p><p><a href="https://elifesciences.org/articles/46415#video2" target="_blank" rel="noopener">喷火龙 · 鸟类落栖慢动作</a></p><p><a href="https://engineering.brown.edu/news/2013-02-20/brown-researchers-build-robotic-bat-wing" target="_blank" rel="noopener">喷火龙 · Brown 蝙蝠翼研究</a></p><p><a href="https://www.allaboutbirds.org/guide/great_blue_heron/id" target="_blank" rel="noopener">喷火龙 · 飞行时向后伸腿参考</a></p><p><a href="https://journals.biologists.com/jeb/article/227/21/jeb247552/362590/The-role-of-mouse-tails-in-response-to-external" target="_blank" rel="noopener">尾巴 · 配重与动态平衡研究</a></p><p><a href="https://www.nasa.gov/missions/station/iss-research/studying-combustion-and-fire-safety/" target="_blank" rel="noopener">尾焰 · NASA 浮力与火焰实验</a></p></details><a href="/">返回 Hero 预览 ↗</a></footer><script src="secret-pathways-assets/three.min.js"></script><script src="pokemon-models/loader.js"></script><script>
/* CHARACTER_FACTORY */
const canvas=document.querySelector('canvas'),r=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});
r.outputEncoding=THREE.sRGBEncoding;r.physicallyCorrectLights=true;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.1;r.setPixelRatio(Math.min(devicePixelRatio,1.75));
const scene=new THREE.Scene();scene.add(new THREE.HemisphereLight(0xcfeaff,0x243342,.7));
for(const [color,intensity,position] of [[0xffedcf,2.4,[-3,5,6]],[0x7acbe8,1.3,[4,3,-4]],[0xe9f4ff,.35,[3,1,5]]]){const light=new THREE.DirectionalLight(color,intensity);light.position.set(...position);scene.add(light);}
const actors=new Map(),slider=document.querySelector('input'),pause=document.getElementById('pause'),loop=document.getElementById('loop');
let kind='charizard',active,clock=0,prev=0,frame=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,looping=false,loopTime=0,speed=1,renderWidth=0,renderHeight=0;
function select(next){if(active)scene.remove(active.actor.group);kind=next;active=actors.get(kind);if(active)scene.add(active.actor.group);document.querySelectorAll('[data-kind]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.kind===kind)));document.documentElement.dataset.model=kind;
 const poses=kind==='pikachu'?[[-.40,'小跑进场'],[-.20,'减速站稳'],[0,'停留'],[.23,'转向'],[.38,'小跑离开']]:kind==='charizard'?[[-.38,'减速伸腿'],[-.212,'落地卸力'],[0,'站稳'],[.30,'下蹲蓄力'],[.365,'蹬地伸展'],[.43,'离地蹬直'],[.49,'向后伸腿'],[.53,'左前方飞来'],[.59,'靠近镜头'],[.67,'左侧出画']]:[[-.38,'下落摆臂'],[-.25,'落地回弹'],[-.20,'四肢回摆'],[0,'熟睡'],[.15,'挠肚子'],[.29,'侧身够肚子'],[.34,'翻身'],[.46,'滑落'],[.56,'下坠摆动']];
 const controls=document.querySelector('.controls');controls.replaceChildren();for(const [at,label] of poses){const button=document.createElement('button');button.textContent=label;button.addEventListener('click',()=>{stopLoop();slider.value=String(at);});controls.append(button);}}

function draw(now){frame=0;const dt=prev?Math.min(.05,(now-prev)/1000):0;prev=now;if(!paused){clock+=dt*speed;if(looping){loopTime=(loopTime+dt*speed)%12;slider.value=String(-.72+1.45*loopTime/12);}}
 const w=canvas.clientWidth,h=canvas.clientHeight;if(w!==renderWidth||h!==renderHeight){r.setSize(w,h,false);renderWidth=w;renderHeight=h;}r.setScissorTest(false);r.clear();
 if(active){const distance=Number(slider.value),intro=Math.max(0,Math.min(1,(distance+.72)/.62));const motion=pokemonScrollMotion(kind,distance,intro);active.actor.update(clock,false,motion);
 const size=Math.min(480,w*.70,h*(kind==='charizard'?.48:.62)),f=active.camera.userData.frame;
 const base={left:(w-size)/2,top:(h-size)/2,width:size,height:size};
 const expanded={left:base.left+f.x*size,top:base.top+f.y*size,width:size*f.scale,height:size*f.scale};
 const rect=pokemonScreenPose(kind,motion,expanded,{width:w,height:h});document.documentElement.dataset.progress=slider.value;document.documentElement.dataset.pose=JSON.stringify({left:rect.left,top:rect.top,width:rect.width,yaw:motion.yaw});
 r.setViewport(rect.left,h-rect.bottom,rect.width,rect.height);r.render(scene,active.camera);
 document.getElementById('phase').textContent=kind==='pikachu'?(motion.entry<.8?'小跑进场':motion.entry<1?'减速站稳':motion.exit<.01?'停留':motion.exit<.2?'转向 → 起步':'小跑离开'):kind==='snorlax'?(motion.entry<1?'落下 → 缓冲':motion.scratch>.2&&motion.exit<.04?'挠挠肚子':motion.exit<.04?'熟睡':motion.exit<.48?'翻身 → 失去支撑':'滑落 → 惯性摆动'):({approach:'靠近',brake:'抬胸减速 · 伸腿',touchdown:'脚掌接触',absorb:'屈膝卸力',settle:'回稳',rest:'站稳',crouch:'下蹲蓄力',push:'双脚蹬地',liftoff:'离地 · 蹬直后伸',fly:'朝左前方 · 靠近镜头'})[motion.action];}
 if(!document.hidden)frame=requestAnimationFrame(draw);}
function stopLoop(){looping=false;loop.setAttribute('aria-pressed','false');}slider.addEventListener('input',stopLoop);
document.querySelectorAll('[data-at]').forEach(b=>b.addEventListener('click',()=>{stopLoop();slider.value=b.dataset.at;}));
document.querySelectorAll('[data-kind]').forEach(b=>b.addEventListener('click',()=>select(b.dataset.kind)));
const slow=document.getElementById('slow');slow.addEventListener('click',()=>{speed=speed===1?.25:1;slow.setAttribute('aria-pressed',String(speed===.25));});
for(const [id,direction] of [['back',-1],['forward',1]])document.getElementById(id).addEventListener('click',()=>{stopLoop();paused=true;syncPause();slider.value=String(Math.max(-.72,Math.min(.73,Number(slider.value)+direction*.005)));clock=Math.max(0,clock+direction/60);});
function syncPause(){pause.setAttribute('aria-pressed',String(paused));pause.textContent=paused?'播放动作':'暂停动作';}syncPause();pause.addEventListener('click',()=>{paused=!paused;syncPause();});
loop.addEventListener('click',()=>{looping=!looping;loopTime=0;loop.setAttribute('aria-pressed',String(looping));if(looping){paused=false;syncPause();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(frame);frame=0;}else if(!frame){prev=0;frame=requestAnimationFrame(draw);}});
loadPokemonModels().then(()=>{for(const name of ['pikachu','snorlax','charizard']){const actor=createPokemonCharacter(name);if(actor)actors.set(name,{actor,camera:createPokemonJourneyCamera(actor,name)});}select(kind);document.getElementById('status').textContent='与 Hero 使用相同动作 · 拖动进度，检查接触、卸力和蹬地';document.documentElement.dataset.characterStatus=actors.size===3?'ready':'partial';frame=requestAnimationFrame(draw);});
</script></body></html>
