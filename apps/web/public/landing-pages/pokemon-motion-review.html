/* Deterministic scroll choreography. Reversing scroll retraces the same path;
 * no event-triggered timers, physics history or extra render loop. */
function pokemonScrollMotion(kind, distance, intro = 1, still = false) {
  const limit = (x) => Math.max(0, Math.min(1, x));
  const smoothstep = (a, b, x) => {
    const t = limit((x - a) / (b - a));
    return t * t * (3 - 2 * t);
  };
  const entry = still
    ? 1
    : kind === "pikachu"
      ? limit(intro)
      : limit((distance + 0.72) / 0.62);
  const exit = still ? 0 : limit((distance - 0.18) / 0.55);
  const opacity = still
    ? Math.abs(distance) < 0.5
      ? 1
      : 0
    : smoothstep(0, 0.035, entry) * (1 - smoothstep(0.92, 1, exit));
  const arrive = 1 - Math.pow(1 - entry, 3),
    leave = exit * exit;
  const motion = {
    distance,
    entry,
    exit,
    opacity,
    arrive,
    leave,
    phase: entry < 0.999 ? "enter" : exit > 0.001 ? "exit" : "rest",
    run: 0,
    sleep: kind === "snorlax" ? 1 : 0,
    flight: 0,
    yaw: 0,
    roll: 0,
    pitch: 0,
    clipTime: 0,
    drop: 0,
    sleepOpacity: 0,
    still,
  };
  if (kind === "pikachu") {
    motion.run = still
      ? 0
      : Math.max(1 - smoothstep(0.75, 1, entry), smoothstep(0, 0.2, exit));
    motion.clipTime = arrive * 1.8 + leave * 1.8;
    motion.yaw =
      -1.2 * (1 - smoothstep(0.7, 1, entry)) + 1.25 * smoothstep(0, 0.3, exit);
    motion.roll = -0.07 * motion.run * (exit > 0 ? -1 : 1);
  } else if (kind === "snorlax") {
    const fall = limit(entry / 0.72),
      settle = limit((entry - 0.72) / 0.28);
    // A supported turn comes first. Gravity starts only after the belly clears
    // the edge; the last half of the scroll beat is the accelerating fall.
    // An itchy belly motivates the roll: reach and scratch before the body
    // starts shifting toward the edge, then release the hand as support goes.
    motion.scratch = still
      ? 0
      : smoothstep(0.025, 0.11, distance) *
        (1 - smoothstep(0.36, 0.46, distance));
    motion.scratchStroke =
      Math.sin(limit((distance - 0.1) / 0.25) * Math.PI * 6) * motion.scratch;
    motion.armReach = still ? 0 : smoothstep(0.16, 0.38, distance);
    motion.shoulderLead = smoothstep(0.02, 0.62, motion.armReach);
    motion.turn = smoothstep(0.18, 0.9, motion.armReach);
    motion.slip =
      smoothstep(0.72, 1, motion.armReach) * smoothstep(0.3, 0.62, exit);
    motion.fall = limit((exit - 0.48) / 0.52);
    // Keep moving into the soft support before settling; an immediate upward
    // bounce at first contact reads like a rigid ball, not a heavy belly.
    motion.drop =
      entry < 0.72
        ? -(1 - fall * fall)
        : 0.035 * Math.sin(settle * Math.PI) * Math.exp(-settle * 2);
    motion.impact =
      entry < 0.72 ? 0 : Math.sin(settle * Math.PI * 2) * Math.exp(-settle * 3);
    motion.incoming = 1 - smoothstep(0.7, 1, entry);
    motion.roll =
      0.48 * (1 - entry) +
      0.11 * motion.impact +
      motion.turn * 1.3 +
      motion.fall * 0.8;
    motion.pitch =
      -0.16 * motion.incoming - 0.35 * motion.slip - motion.fall * 0.75;
    motion.yaw =
      0.12 * motion.incoming + 0.22 * motion.turn + motion.fall * 0.48;
    motion.sleepOpacity =
      smoothstep(0.94, 1, entry) *
      (still ? 1 : 1 - smoothstep(0.025, 0.1, distance));
  } else if (kind === "charizard") {
    Object.assign(motion, pokemonCharizardMechanics(entry, exit));
    motion.clipTime = arrive * 2.4 + leave * 2.4;
    // Head anticipates the left-front destination. The trunk follows after
    // toe-off through a modest bank, without reversing its forward axis.
    motion.yaw =
      -0.9 * (1 - motion.approach) - 0.72 * smoothstep(0, 0.65, motion.depart);
    motion.roll =
      -0.24 * Math.sin(Math.min(1, entry / 0.7) * Math.PI) +
      0.16 * Math.sin(motion.depart * Math.PI);
    motion.pitch =
      0.32 * motion.flight -
      0.27 * motion.brake +
      0.2 * motion.crouch +
      0.14 * smoothstep(0, 0.65, motion.depart);
  }
  return motion;
}
function pokemonScreenPose(kind, motion, anchor, viewport) {
  const right = viewport.width - anchor.left + anchor.width;
  let x = 0,
    y = 0;
  if (kind === "pikachu") {
    x = right * (1 - motion.arrive + motion.leave);
    y = -Math.sin(motion.entry * Math.PI) * anchor.height * 0.035;
  } else if (kind === "snorlax") {
    y =
      (anchor.top + anchor.height * 1.15) * motion.drop +
      (viewport.height - anchor.top + anchor.height) *
        motion.fall *
        motion.fall +
      anchor.height * 0.1 * motion.slip;
    x =
      anchor.width *
      (-0.035 * Math.sin(motion.exit * Math.PI * 2) +
        0.24 * motion.turn +
        0.22 * motion.slip +
        0.18 * motion.fall);
  } else if (kind === "charizard") {
    // Accelerate left AND toward the viewer in one continuous arc. Uniform
    // perspective enlargement preserves the original model proportions.
    // The whole silhouette clears the left edge before its opacity fades.
    const progress = motion.depart,
      near = Math.min(1, progress / 0.9);
    const depth = near * near * (3 - 2 * near),
      scale = 1 + 1.45 * depth;
    const travel =
      (0.12 * progress * progress + 0.88 * Math.pow(progress, 4)) / 0.57;
    const width = anchor.width * scale,
      height = anchor.height * scale;
    const center = anchor.left + anchor.width / 2;
    const clearance = center + anchor.width * 1.225 + viewport.width * 0.12;
    x = right * (1 - motion.approach) - clearance * travel;
    const centerY = anchor.top + anchor.height / 2;
    // A high desktop perch needs a lower projected centre as the body grows,
    // otherwise its face flies behind the navigation before reaching us.
    const nearCenterY = Math.max(centerY, viewport.height * 0.46);
    y =
      -(anchor.top + anchor.height) * (1 - motion.approach) +
      (nearCenterY - centerY) * depth -
      anchor.height *
        (motion.climb +
          0.06 * travel +
          0.06 * Math.pow(Math.sin(progress * Math.PI), 2));
    const left = center + x - width / 2,
      top = centerY + y - height / 2;
    return {
      left,
      top,
      width,
      height,
      right: left + width,
      bottom: top + height,
    };
  }
  return {
    left: anchor.left + x,
    top: anchor.top + y,
    width: anchor.width,
    height: anchor.height,
    right: anchor.left + x + anchor.width,
    bottom: anchor.top + y + anchor.height,
  };
}

// Contact, load acceptance and propulsion are separate from aerial travel.
// Feet stay planted through the crouch; the flight path starts at toe-off.
function pokemonCharizardMechanics(entry, exit) {
  const clamp = (x) => Math.max(0, Math.min(1, x));
  const ease = (a, b, x) => {
    const t = clamp((x - a) / (b - a));
    return t * t * (3 - 2 * t);
  };
  const pulse = (a, b, c, x) => ease(a, b, x) * (1 - ease(b, c, x));
  const contact = ease(0.64, 0.72, entry),
    release = ease(0.36, 0.44, exit);
  const landingLoad = pulse(0.68, 0.82, 1, entry);
  const windup = pulse(0.015, 0.22, 0.38, exit);
  const push = ease(0.22, 0.38, exit) * (1 - ease(0.4, 0.5, exit));
  const depart = clamp((exit - 0.4) / 0.6);
  const flight = Math.max(1 - contact, release);
  return {
    approach: 1 - Math.pow(1 - clamp(entry / 0.7), 2),
    depart,
    // A delayed rise continues through recovery after each force-producing
    // downstroke. This carries the body upward rather than just waggling wings.
    climb:
      0.025 * ease(0.4, 0.49, exit) +
      0.025 * ease(0.51, 0.64, exit) +
      0.02 * ease(0.67, 0.81, exit),
    contact,
    support: contact * (1 - release),
    flight,
    landingLoad,
    windup,
    push,
    crouch: landingLoad + windup,
    brake: pulse(0.38, 0.63, 0.8, entry),
    reach: pulse(0.42, 0.66, 0.84, entry),
    // Extend through toe-off, then sweep the extended legs aft. The ankle
    // follows the hip slightly later instead of snapping the toes backward.
    legSweep: exit > 0 ? ease(0.4, 0.62, exit) : 1 - ease(0.28, 0.55, entry),
    ankleSweep: exit > 0 ? ease(0.43, 0.68, exit) : 1 - ease(0.3, 0.58, entry),
    gazeYaw:
      -0.5 * pulse(0.15, 0.55, 0.88, entry) -
      0.65 * pulse(0.015, 0.2, 0.78, exit),
    gazePitch:
      0.28 * pulse(0.15, 0.55, 0.88, entry) -
      0.3 * pulse(0.015, 0.2, 0.75, exit),
    wingDrive: Math.max(
      flight,
      0.55 * pulse(0.68, 0.72, 0.95, entry),
      0.75 * ease(0.1, 0.34, exit),
    ),
    action:
      entry < 0.55
        ? "approach"
        : entry < 0.7
          ? "brake"
          : entry < 0.76
            ? "touchdown"
            : entry < 0.9
              ? "absorb"
              : entry < 1
                ? "settle"
                : exit < 0.015
                  ? "rest"
                  : exit < 0.22
                    ? "crouch"
                    : exit < 0.4
                      ? "push"
                      : exit < 0.5
                        ? "liftoff"
                        : "fly",
  };
}

// Shoulder-led power stroke followed by a folded recovery. Phase delays are
// fractions of one beat, not accumulated spring state, so scrubbing retraces it.
function pokemonCharizardWingBeat(time, motion) {
  const ease = (a, b, x) => {
    const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
    return t * t * (3 - 2 * t);
  };
  const down = 0.42;
  const launch =
    ease(0.015, 0.14, motion.exit) * (1 - ease(0.96, 1, motion.exit));
  // Three visible power strokes: the first overlaps leg extension and toe-off;
  // the second and third continue supporting and accelerating the airborne body.
  // Each recovery returns to the raised pose before the next depression.
  const launchPhase =
    down * ease(0.2, 0.4, motion.exit) +
    (1 - down) * ease(0.4, 0.48, motion.exit) +
    down * ease(0.48, 0.56, motion.exit) +
    (1 - down) * ease(0.56, 0.64, motion.exit) +
    down * ease(0.64, 0.72, motion.exit) +
    (1 - down) * ease(0.72, 0.8, motion.exit) +
    ease(0.8, 0.96, motion.exit);
  const cycle = time * 0.82;
  const sample = (phase, folding, force = false) => {
    const p = ((phase % 1) + 1) % 1;
    if (force) return p < down ? Math.sin((p / down) * Math.PI) ** 2 : 0;
    if (folding)
      return p < down ? 0 : Math.sin(((p - down) / (1 - down)) * Math.PI) ** 2;
    return p < down
      ? Math.cos((p / down) * Math.PI)
      : -Math.cos(((p - down) / (1 - down)) * Math.PI);
  };
  const blend = (lag, folding, force = false) => {
    const cruising = sample(cycle - lag, folding, force);
    // Clamp the first stroke's delayed joints at the raised pose, rather than
    // wrapping the elbow/wrist into a fictitious preceding recovery stroke.
    return (
      cruising * (1 - launch) +
      sample(Math.max(0, launchPhase - lag), folding, force) * launch
    );
  };
  return {
    launch,
    launchPhase,
    stroke: (lag = 0) => blend(lag, false),
    fold: (lag = 0) => blend(lag, true),
    power: (lag = 0) => blend(lag, false, true),
  };
}

/* Faithful rigged GLB assets, pinned in vendor/pokemon-models/sources.json.
 * Only uniform outer scale/placement changes; original mesh and bones survive.
 * Animation uses Kage's clock, so pausing the journey freezes these actors too. */
const POKEMON_MODELS = new Map();
async function loadPokemonModels() {
  const loader = new PokemonGLTF.GLTFLoader();
  // Embedded GLB images use blob URLs. HTMLImageElement follows img-src;
  // ImageBitmapLoader would fetch them under the stricter connect-src policy.
  loader.register(parser => {
    parser.textureLoader = new THREE.TextureLoader(parser.options.manager);
    return { name: 'LOCAL_IMAGE_TEXTURES' };
  });
  await Promise.all(['pikachu', 'snorlax', 'charizard'].map(async kind => {
    try {
      const gltf = await loader.loadAsync('pokemon-models/' + kind + '.glb');
      gltf.scene.traverse(node => {
        if (!node.isMesh) return;
        // r149 culls skinned submeshes using their undeformed bounds. Eye
        // meshes can otherwise vanish in the tightly framed square overlay.
        node.frustumCulled = false;
        for (const material of Array.isArray(node.material) ? node.material : [node.material]) {
          // Keep the authored colour textures but soften realistic micro-bumps
          // into the clean animated-film surface used by the surrounding scene.
          material.normalMap = null;
          material.roughness = .8;
          if (material.name === 'fire_gltf') {
            material.emissive.setHex(0xff6b08).convertSRGBToLinear();
            material.emissiveIntensity = 1.4;
          }
        }
      });
      POKEMON_MODELS.set(kind, gltf);
    } catch (error) { console.warn('Model unavailable: ' + kind, error); }
  }));
}
// r149 Box3 uses undeformed geometry bounds. Measure the skinned idle pose,
// including the real wing and tail extent, before framing or normalizing it.
function pokemonPoseBounds(root) {
  root.updateMatrixWorld(true);
  root.traverse(node => { if (node.isSkinnedMesh) node.skeleton.update(); });
  const bounds = new THREE.Box3(), vertex = new THREE.Vector3();
  root.traverse(node => {
    if (!node.isMesh || !node.visible) return;
    const position = node.geometry.getAttribute('position');
    for (let i = 0; i < position.count; i++) {
      vertex.fromBufferAttribute(position, i);
      if (node.isSkinnedMesh) node.boneTransform(i, vertex);
      bounds.expandByPoint(vertex.applyMatrix4(node.matrixWorld));
    }
  });
  return bounds;
}
function createPokemonCharacter(kind) {
  const source = POKEMON_MODELS.get(kind);
  if (!source) return null;
  const group = new THREE.Group(),
    model = PokemonSkeletonUtils.clone(source.scene);
  group.add(model);
  const mixer = new THREE.AnimationMixer(model);
  const idle = mixer.clipAction(
    THREE.AnimationClip.findByName(source.animations, "idle"),
  );

  mixer.setTime(0);
  const bounds = pokemonPoseBounds(model),
    size = bounds.getSize(new THREE.Vector3());
  const scale = 3.4 / size.y;
  // Center by the original model's origin, not by an asymmetric tail's bounds.
  model.scale.multiplyScalar(scale);
  model.position.y -= bounds.min.y * scale;
  const height = 3.4,
    centerY = height / 2;
  const happyClip =
    kind === "pikachu" &&
    THREE.AnimationClip.findByName(source.animations, "happy");
  const happy = happyClip ? mixer.clipAction(happyClip).play() : null;
  if (happy) happy.setEffectiveWeight(0);
  const actions = {};
  for (const name of ["run", "sleep"]) {
    const clip = THREE.AnimationClip.findByName(source.animations, name);
    if (clip)
      actions[name] = mixer.clipAction(clip).play().setEffectiveWeight(0);
  }
  // Restore every additive joint, including ones whose source track is static.
  // Offsets are expressed in model axes, then transformed into the joint's
  // parent space: these imported bones do NOT share intuitive local XYZ axes.
  const joints = new Map();
  model.traverse((bone) => {
    if (bone.isBone || /^(spine_0[12]|waist|hips)$/.test(bone.name))
      joints.set(bone.name, { bone, base: bone.quaternion.clone() });
  });
  const wingRest = new Map();
  if (kind === "charizard")
    joints.forEach(({ bone }, name) => {
      if (name.includes("_wing_")) wingRest.set(name, bone.quaternion.clone());
    });
  // The pinned Charizard mesh already carries membrane-spar skin weights.
  // Clone just that geometry; body/eyes/fire and the cached GLB stay untouched.
  // A bind-space camber corrective complements the spar articulation instead
  // of replacing skinning. Blended spar weights taper it at rigid attachments.
  const membranes = [];
  if (kind === "charizard")
    model.traverse((mesh) => {
      if (!mesh.isSkinnedMesh) return;
      const indices = mesh.geometry.getAttribute("skinIndex"),
        weights = mesh.geometry.getAttribute("skinWeight"),
        mask = [];
      for (let i = 0; i < weights.count; i++) {
        let spar = 0;
        for (let j = 0; j < 4; j++) {
          const bone = mesh.skeleton.bones[indices.array[i * 4 + j]];
          if (bone.name.endsWith("_wing_b")) spar += weights.array[i * 4 + j];
        }
        if (spar > 0.001 && spar < 0.999)
          mask.push({ index: i, amount: 4 * spar * (1 - spar) });
      }
      if (!mask.length) return;
      mesh.geometry = mesh.geometry.clone();
      const geometry = mesh.geometry,
        normals = geometry.attributes.normal.array.slice();
      geometry.computeVertexNormals();
      const geometricNormals = geometry.attributes.normal.array.slice();
      geometry.attributes.normal.array.set(normals);
      membranes.push({
        geometry,
        mask,
        rest: geometry.attributes.position.array.slice(),
        normals,
        geometricNormals,
      });
    });
  const membraneNormal = new THREE.Vector3();
  function flexMembranes(beat, effort) {
    for (const {
      geometry,
      mask,
      rest,
      normals,
      geometricNormals,
    } of membranes) {
      const position = geometry.attributes.position;
      position.array.set(rest);
      for (const { index, amount } of mask) {
        // Load travels from the inner panel toward the tip. The recovery is
        // softer, with a small delayed reverse bend at stroke reversal.
        const span = Math.min(1, Math.abs(rest[index * 3]) / 1.25),
          lag = 0.065 + span * 0.09,
          pressure = beat ? beat.power(lag) : 0,
          recovery = beat ? beat.fold(lag) : 0,
          recoil = beat ? beat.stroke(lag + 0.07) - beat.stroke(lag) : 0;
        position.array[index * 3 + 2] -=
          effort *
          amount *
          (0.085 * pressure - 0.035 * recovery + 0.025 * recoil);
      }
      position.needsUpdate = true;
      if (effort > 0) {
        geometry.computeVertexNormals();
        // Apply only the change in geometric normal to the authored smooth
        // normal. Replacing it outright would pop at the first nonzero load.
        const bent = geometry.attributes.normal.array.slice();
        geometry.attributes.normal.array.set(normals);
        for (const { index } of mask) {
          membraneNormal.fromArray(normals, index * 3);
          membraneNormal.x += bent[index * 3] - geometricNormals[index * 3];
          membraneNormal.y +=
            bent[index * 3 + 1] - geometricNormals[index * 3 + 1];
          membraneNormal.z +=
            bent[index * 3 + 2] - geometricNormals[index * 3 + 2];
          membraneNormal
            .normalize()
            .toArray(geometry.attributes.normal.array, index * 3);

      geometry.attributes.normal.needsUpdate = true;
      geometry.computeBoundingSphere();
    }
  }
  const axis = new THREE.Vector3(),
    parentRotation = new THREE.Quaternion(),
    offset = new THREE.Quaternion();
  const jointFrame = new THREE.Matrix4(),
    framePosition = new THREE.Vector3(),
    frameScale = new THREE.Vector3();
  function rotateJoint(name, x, y, z, angle) {

            sign * (0.5 * landingLoad + 0.26 * brake + 0.12 * windup),
          );
          rotateJoint(
            side + "_arm_02",
            1,
            0,
            0,
            -0.22 * flight - 0.34 * delayedLoad + 0.3 * push,
          );
          rotateJoint(
            side + "_hand",
            1,
            0,
            0,
            -0.24 * delayedLoad + 0.12 * push,
          );
          // Wing impulse reaches the free limbs after the chest. Keep knees
          // softly extended and leave supported feet to the final IK pass.
          rotateJoint(
            side + "_arm_01",
            1,
            0,
            0,
            0.09 * wingStroke(0.2) * flight,
          );
          rotateJoint(
            side + "_arm_02",
            1,
            0,
            0,
            0.11 * wingStroke(0.28) * flight,
          );
          rotateJoint(
            side + "_hand",
            1,
            0,
            0,
            0.14 * wingStroke(0.36) * flight,
          );
          rotateJoint(
            side + "_arm_01",
            0,
            0,
            1,
            -0.35 * motion.roll + 0.07 * sign * wingStroke(0.24) * flight,
          );
          rotateJoint(
            side + "_leg_01",
            1,
            0,
            0,
            0.055 * wingStroke(0.24) * flight,
          );
          rotateJoint(
            side + "_foot",
            1,
            0,
            0,
            0.075 * wingStroke(0.34) * flight,
          );
          rotateJoint(
            side + "_toe",
            1,
            0,
            0,
            0.025 * wingStroke(0.42) * flight,
          );
          for (const finger of ["index", "middle", "ring"])
            rotateJoint(
              side + "_" + finger + "_02",
              1,
              0,
              0,
              0.065 * wingStroke(0.43) * flight,
            );
        }
        rotateJoint(
          "spine_01",
          1,
          0,
          0,
          0.1 * flight + 0.2 * crouch - 0.1 * push,
        );
        rotateJoint("spine_02", 1, 0, 0, 0.12 * delayedLoad - 0.08 * push);
        rotateJoint(
          "neck_01",
          1,
          0,
          0,
          -0.15 * flight - motion.pitch * 0.48 - 0.14 * crouch,
        );
        rotateJoint(
          "neck_02",
          1,
          0,
          0,
          -0.07 * flight + 0.1 * delayedLoad - 0.06 * push,
        );
        rotateJoint("head", 1, 0, 0, 0.14 * delayedLoad - 0.09 * crouch);
        const oldChest = laggedMotion(motion, 0.022),
          oldHead = laggedMotion(motion, 0.045);
        rotateJoint("spine_01", 1, 0, 0, -0.065 * wingStroke(0.08) * wingLoad);
        rotateJoint(
          "spine_02",
          1,
          0,
          0,
          -0.035 * wingStroke(0.14) * wingLoad +
            0.22 * (oldChest.pitch - motion.pitch),
        );
        rotateJoint(
          "neck_01",
          1,
          0,
          0,
          0.045 * wingStroke(0.16) * wingLoad +
            0.18 * (oldHead.pitch - motion.pitch),
        );
        rotateJoint("neck_03", 1, 0, 0, 0.03 * wingStroke(0.23) * wingLoad);
        rotateJoint("head", 1, 0, 0, 0.025 * wingStroke(0.3) * wingLoad);
        rotateJoint("neck_01", 0, 0, 1, -0.32 * motion.roll);
        rotateJoint("neck_02", 0, 1, 0, 0.12 * (oldHead.yaw - motion.yaw));
        // Look at the destination before the trunk commits to the move.
        // Distribute the aim through the neck rather than snapping the head.
        for (const [joint, weight] of [
          ["neck_01", 0.5],
          ["neck_02", 0.3],
          ["head", 0.2],
        ]) {
          rotateJoint(joint, 0, 1, 0, motion.gazeYaw * weight);
          rotateJoint(joint, 1, 0, 0, motion.gazePitch * weight);
        }
        const tailPose = (i, delay = 0) => {
          const now = laggedMotion(motion, delay),
            delayed = laggedMotion(motion, 0.012 * i + delay);
          const landing = impulse(
            motion.distance - delay,
            -0.2736,
            0.07 * i,
            5,
            3.6,
          );
          return {
            pitch:
              (-0.022 +
                0.055 * wingStroke(0.12 + i * 0.065 + (delay * 0.82) / 0.28)) *
                now.flight +
              0.095 * delayed.crouch -
              0.075 * delayed.push +
              0.055 * delayed.brake +
              0.2 * (delayed.pitch - now.pitch) +
              0.026 * landing,
            yaw:
              -0.1 * now.roll -
              0.05 * delayed.gazeYaw +
              0.26 * (delayed.yaw - now.yaw) +
              0.025 *
                wingStroke(0.22 + i * 0.07 + (delay * 0.82) / 0.28) *
                now.flight,
          };
        };
        for (let i = 1; i <= 7; i++) {
          const current = tailPose(i),
            prior = tailPose(i, 0.01);
          rotateJoint("tail_0" + i, 1, 0, 0, current.pitch);
          rotateJoint("tail_0" + i, 0, 1, 0, current.yaw);
          tailRates[i - 1].pitch =
            (current.pitch - prior.pitch) / (0.01 / 0.28);
          tailRates[i - 1].yaw = (current.yaw - prior.yaw) / (0.01 / 0.28);
        }
        // The chest rises after the power stroke; it must not drop with the wings.
        bob =
          -0.085 * wingStroke(0.09) * flight -
          0.3 * crouch +
          0.025 * push +
          0.07 * beat.power(0.05) * push * motion.support;
      }
      group.rotation.set(
        motion?.pitch || 0,
        motion?.yaw || 0,
        motion?.roll || 0,
      );
      if (motion && kind !== "pikachu") {
        // Tumble about the belly, not the feet. Preserve the actual mesh scale.
        pivot.set(
          0,
          kind === "snorlax" ? 0.75 : 1.55,
          kind === "snorlax" ? -0.65 : 0,
        );
        group.position
          .copy(pivot)
          .sub(pivotOffset.copy(pivot).applyQuaternion(group.quaternion));
        group.position.y += bob;
      }
      group.updateMatrixWorld(true);
      if (kind === "charizard" && motion && !motion.still)
        plantFeet(motion.support, motion.push);
      if (kind === "charizard" && motion && !motion.still)
        animateFlame(local, motion);
    },
    get time() {
      return lastTime;
    },
    dispose() {
      mixer.stopAllAction();
      mixer.uncacheRoot(model);
      for (const { geometry } of membranes) geometry.dispose();
    },
  };
}

// Fit the actual posed vertices in camera space, rather than shrinking a long
// tail by its depth or clipping it by assuming the body origin is the centre.
function createPokemonCamera(
  actor,
  angle = 0.3,
  elevation = 0.65,
  aspect = 1,
  poses = null,
) {
  const camera = new THREE.OrthographicCamera(-3, 3, 3, -3, 0.1, 100);
  camera.position.set(
    Math.sin(angle) * 10,
    actor.centerY + elevation,
    Math.cos(angle) * 10,
  );
  camera.lookAt(0, actor.centerY, 0);
  camera.updateMatrixWorld(true);
  const bounds = new THREE.Box3(),
    vertex = new THREE.Vector3();
  for (const pose of poses || [null]) {
    if (pose) actor.update(pose.time || 0, false, pose.motion);
    actor.group.updateMatrixWorld(true);
    actor.group.traverse((node) => {
      if (!node.isMesh || !node.visible) return;
      if (node.isSkinnedMesh) node.skeleton.update();
      const position = node.geometry.getAttribute("position");
      for (let i = 0; i < position.count; i++) {
        vertex.fromBufferAttribute(position, i);
        if (node.isSkinnedMesh) node.boneTransform(i, vertex);
        bounds.expandByPoint(
          vertex
            .applyMatrix4(node.matrixWorld)
            .applyMatrix4(camera.matrixWorldInverse),
        );
      }
    });
  }
  const center = bounds.getCenter(new THREE.Vector3()),
    size = bounds.getSize(new THREE.Vector3());
  const height = Math.max(size.y, size.x / aspect) * 1.32,
    width = height * aspect;
  camera.left = center.x - width / 2;
  camera.right = center.x + width / 2;
  camera.bottom = center.y - height / 2;
  camera.top = center.y + height / 2;
  camera.updateProjectionMatrix();
  return camera;
}

function createPokemonJourneyCamera(actor, kind) {
  const elevation = kind === "snorlax" ? 9 : 0.65;
  const angle = kind === "snorlax" ? 1.65 : 0.3;
  actor.update(0, false, pokemonScrollMotion(kind, 0, 1));
  const reference = createPokemonCamera(actor, angle, elevation);
  const poses = [];
  for (const distance of [
    -0.7, -0.55, -0.4, -0.25, -0.1, 0, 0.25, 0.4, 0.55, 0.7,
  ]) {
    const intro = Math.max(0, Math.min(1, (distance + 0.72) / 0.62));
    poses.push({ time: 0, motion: pokemonScrollMotion(kind, distance, intro) });
  }
  for (const time of [0, 0.15, 0.3, 0.45, 0.6, 0.8, 1, 1.15, 2.5, 4]) {
    for (const distance of kind === "pikachu"
      ? [0]
      : [-0.5, 0, 0.38, 0.48, 0.6])
      poses.push({ time, motion: pokemonScrollMotion(kind, distance, 1) });
  }
  const camera = createPokemonCamera(actor, angle, elevation, 1, poses);
  actor.update(0, false, pokemonScrollMotion(kind, 0, 1));
  // Expand only the offscreen render viewport for moving wings/tails, keeping
  // the resting body the same on-screen size as the approved static version.
  const span = reference.right - reference.left;
  const vertex = new THREE.Vector3();
  let bottom = 1;
  actor.group.traverse((node) => {
    if (!node.isMesh) return;
    if (node.isSkinnedMesh) node.skeleton.update();
    const position = node.geometry.getAttribute("position");
    for (let i = 0; i < position.count; i++) {
      vertex.fromBufferAttribute(position, i);
      if (node.isSkinnedMesh) node.boneTransform(i, vertex);
      vertex.applyMatrix4(node.matrixWorld).project(reference);
      bottom = Math.min(bottom, vertex.y);
    }
  });
  camera.userData.frame = {
    scale: (camera.right - camera.left) / span,
    x: (camera.left - reference.left) / span,
    y: (reference.top - camera.top) / span,
    foot: (1 - bottom) / 2,
  };
  return camera;
}

function select(next){if(active)scene.remove(active.actor.group);kind=next;active=actors.get(kind);if(active)scene.add(active.actor.group);document.querySelectorAll('[data-kind]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.kind===kind)));document.documentElement.dataset.model=kind;
 const poses=kind==='pikachu'?[[-.40,'小跑进场'],[-.20,'减速站稳'],[0,'停留'],[.23,'转向'],[.38,'小跑离开']]:kind==='charizard'?[[-.38,'减速伸腿'],[-.212,'落地卸力'],[0,'站稳'],[.30,'下蹲蓄力'],[.365,'蹬地伸展'],[.43,'离地蹬直'],[.49,'向后伸腿'],[.53,'左前方飞来'],[.59,'靠近镜头'],[.67,'左侧出画']]:[[-.38,'下落摆臂'],[-.25,'落地回弹'],[-.20,'四肢回摆'],[0,'熟睡'],[.15,'挠肚子'],[.29,'侧身够肚子'],[.34,'翻身'],[.46,'滑落'],[.56,'下坠摆动']];

function draw(now){frame=0;const dt=prev?Math.min(.05,(now-prev)/1000):0;prev=now;if(!paused){clock+=dt*speed;if(looping){loopTime=(loopTime+dt*speed)%12;slider.value=String(-.72+1.45*loopTime/12);}}
 const w=canvas.clientWidth,h=canvas.clientHeight;if(w!==renderWidth||h!==renderHeight){r.setSize(w,h,false);renderWidth=w;renderHeight=h;}r.setScissorTest(false);r.clear();

 const size=Math.min(480,w*.70,h*(kind==='charizard'?.48:.62)),f=active.camera.userData.frame;

loadPokemonModels().then(()=>{for(const name of ['pikachu','snorlax','charizard']){const actor=createPokemonCharacter(name);if(actor)actors.set(name,{actor,camera:createPokemonJourneyCamera(actor,name)});}select(kind);document.getElementById('status').textContent='与 Hero 使用相同动作 · 拖动进度，检查接触、卸力和蹬地';document.documentElement.dataset.characterStatus=actors.size===3?'ready':'partial';frame=requestAnimationFrame(draw);});
